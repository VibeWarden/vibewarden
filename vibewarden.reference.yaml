# VibeWarden — full configuration reference (base / dev config).
#
# This file is the reference for vibewarden.yaml, the LOCAL DEV config.
# For production, use vibewarden.production.yaml as an override file —
# `vibew bundle` deep-merges it on top of this file when it writes the
# self-contained deploy artifact under .vibewarden/bundle/.
#
# If you are getting started, open `vibewarden.example.yaml` instead. It
# is a short, curated starter config that covers the common cases. Copy
# that to `vibewarden.yaml` and add sections from this file only when you
# need them.
#
# This file documents EVERY supported option. Use it as a lookup, not as
# a template. Scroll down from here at your own risk — most projects
# don't need most of this.
#
# All settings can be overridden by environment variables using the
# VIBEWARDEN_ prefix. Example: VIBEWARDEN_SERVER_PORT=9090 overrides
# server.port.
#
# Full reference docs: https://vibewarden.dev/docs/vibewarden/configuration/
#
# Any string field supports secret:// URIs that resolve from the encrypted
# secret store at config load time. This keeps plaintext secrets out of YAML.
#
# URI format: secret://path/key
#   - path:  the secret store path (everything before the last segment)
#   - key:   the individual key within that path (the last segment)
#
# Full-field resolution (entire value is a secret):
#   admin:
#     token: secret://admin/api/token
#   auth:
#     jwt:
#       audience: secret://auth/jwt/audience
#   database:
#     external_url: secret://infra/db/connection_string
#
# Composite values -- embed secrets inside larger strings with ${secret://...}:
#   app:
#     environment:
#       DATABASE_URL: "postgres://user:${secret://db/password}@host:5432/db"
#       AUTH_HEADER: "Bearer ${secret://auth/api/token}"
#
# Escape with $${secret://...} to produce a literal ${secret://...} string:
#   app:
#     environment:
#       EXAMPLE: "literal $${secret://not/resolved}"
#
# Store secrets with:
#   vibew secret set auth/google client_id=xxx client_secret=xxx
#
# The secrets.* config section itself cannot use secret:// URIs because the
# secret store is bootstrapped from that section (see ADR-076).

# Project name — controls Docker Compose project name, image tags (<name>-app),
# and deploy directory names.
#
# `vibew init` and `vibew wrap` always write this field (default: directory
# name). You should only override it explicitly when running multiple
# VibeWarden projects on the same machine to prevent Docker name collisions.
#
# Derivation order (for projects that pre-date v0.18.2 and lack this field):
#   1. This field (name:)
#   2. Current directory name (lowercased, sanitized)
#   3. "vibewarden" (last-resort fallback)
#
# Can also be set via: vibew init --name <name>
#
# name: my-project

# Database configuration
#
# By default, VibeWarden uses the local Postgres container started by the
# generated docker-compose.yml. Set external_url to switch to a managed
# Postgres service (AWS RDS, Supabase, Neon, Hetzner Managed Databases).
#
# When external_url is set, vibew generate omits the local postgres container from
# the generated docker-compose.yml and uses this URL as the Kratos DSN.
#
# See docs/postgres.md for deployment strategies and provider-specific examples.
#
# database:
#   # Full postgres:// connection URL for an external managed Postgres instance.
#   # Set via VIBEWARDEN_DATABASE_EXTERNAL_URL env var in production.
#   # Example (AWS RDS):
#   #   external_url: "postgres://vibewarden:${DB_PASSWORD}@mydb.abc123.eu-west-1.rds.amazonaws.com:5432/vibewarden"
#   # Example (Supabase pooler):
#   #   external_url: "postgres://postgres.abcdefgh:${DB_PASSWORD}@aws-0-eu-central-1.pooler.supabase.com:6543/postgres"
#   # Example (Neon):
#   #   external_url: "postgres://vibewarden:${DB_PASSWORD}@ep-cool-rain-12345.eu-central-1.aws.neon.tech/neondb"
#   # Example (Hetzner):
#   #   external_url: "postgres://vibewarden:${DB_PASSWORD}@<db-host>.hc-<region>.hetzner.cloud:5432/vibewarden"
#   external_url: ""
#
#   # PostgreSQL SSL/TLS negotiation mode.
#   # Accepted values: "disable", "require", "verify-ca", "verify-full"
#   # Default: "require"
#   # Applied as sslmode=<value> in the connection string unless the URL already
#   # includes an sslmode query parameter.
#   # Use "disable" only on localhost or trusted private networks.
#   # Use "verify-full" for strongest security (requires PGSSLROOTCERT to be set).
#   tls_mode: require
#
#   # Connection pool settings
#   pool:
#     # Maximum number of open connections in the pool. Default: 10.
#     # For multi-instance setups, size this so that N_instances * max_conns
#     # stays below the database's max_connections limit.
#     max_conns: 10
#     # Minimum number of idle connections kept open. Default: 2.
#     # Set to 0 or 1 on serverless databases (Neon, Supabase) to avoid
#     # holding idle connections that count against the tier limit.
#     min_conns: 2
#
#   # Maximum time to wait when establishing a new Postgres connection.
#   # Go duration string (e.g. "10s", "30s"). Default: "10s".
#   # Increase to "15s" or "30s" for serverless databases with cold-start latency.
#   connect_timeout: "10s"

# Server settings
server:
  # Host to bind to (use 0.0.0.0 to expose externally)
  host: "127.0.0.1"
  # Port to listen on
  port: 8443

# Upstream application being protected
upstream:
  # Host of your application
  host: "127.0.0.1"
  # Port of your application
  port: 3000

  # Active upstream health probe — drives the /_vibewarden/health endpoint.
  # The sidecar probes the upstream over HTTP and caches the result; every
  # request to /_vibewarden/health reads the cached state (no extra I/O on
  # the request path). See ADR-098.
  health:
    # Enable the background upstream health probe. Default: true (since v0.18.2).
    # When false, /_vibewarden/health reports "upstream":"unknown" and logs a
    # Warn at boot so the operator is aware. Set to false only if your upstream
    # has no health endpoint.
    enabled: true

    # Path probed on the upstream (must return 2xx to be considered healthy).
    # Default: "/health"
    path: "/health"

    # How often to probe the upstream. Default: "5s"
    interval: "5s"

    # Maximum time to wait for a single probe response. Default: "2s"
    timeout: "2s"

    # Consecutive failures required to transition "ok" → "failing". Default: 3
    unhealthy_threshold: 3

    # Consecutive successes required to transition "failing" → "ok". Default: 2
    healthy_threshold: 2

# Application container configuration
#
# Controls how the app runs inside Docker Compose. `vibew build` builds
# the image locally; `vibew bundle` packages it into image.tar (via
# docker save/load) so no source code ships to the server. Use
# `environment` for runtime config (database URLs, API keys, etc.) --
# never bake secrets into the image.
#
# app:
#   # Docker build context path (e.g., "." for the current directory).
#   # When set, `vibew build` builds the image locally. `vibew bundle`
#   # packages the built image into image.tar, not the source code.
#   build: "."
#
#   # Docker image reference. Default: derived from the project name.
#   # For registry images, set to e.g. "ghcr.io/org/myapp:latest".
#   image: "myapp:latest"
#
#   # Language/runtime for health check probe selection.
#   # Values: "go", "python", "typescript", "kotlin", or empty (auto-detect).
#   language: ""
#
#   # Custom Docker healthcheck command. Set to "none" to disable.
#   healthcheck: ""
#
#   # Custom environment variables injected into the app container.
#   # Use for runtime configuration (database URLs, feature flags, etc.).
#   # Example:
#   #   environment:
#   #     DATABASE_URL: "postgres://user:pass@db:5432/myapp"
#   #     REDIS_URL: "redis://redis:6379"
#   #     LOG_LEVEL: "info"
#   environment: {}

# TLS configuration
tls:
  # Enable TLS termination. Enabled by default — VibeWarden is secure by default.
  # When enabled, HTTP requests on port 80 are automatically redirected to HTTPS.
  enabled: true

  # Provider selects how TLS certificates are obtained. Valid values:
  #
  #   letsencrypt  — ACME with Let's Encrypt (primary). When "email" is set,
  #                  ZeroSSL is appended as a secondary issuer; when "email"
  #                  is empty, the chain degrades to single-issuer LE and a
  #                  tls.acme.chain_skipped event is emitted at startup.
  #                  (Alias: "acme". Both values select the same behaviour.)
  #                  Requires a public domain and open port 443.
  #                  Also requires the "domain" field to be set.
  #                  Buypass is no longer part of the default chain — see
  #                  ADR-083; use "provider: buypass" below to opt in.
  #
  #   zerossl      — ACME via ZeroSSL only (no fallback chain).
  #                  Requires "email" for EAB auto-registration.
  #
  #   buypass      — ACME via Buypass Go SSL only (explicit opt-in; upstream
  #                  currently returns 403 per ADR-083). 180-day certificates,
  #                  no signup required.
  #
  #   letsencrypt-staging — ACME via Let's Encrypt staging (not browser-trusted).
  #                  Use for testing to avoid rate limits.
  #
  #   self-signed  — Caddy generates an internal self-signed certificate.
  #                  Suitable for local development and internal services.
  #                  Browsers will show a security warning.
  #
  #   external     — You supply the certificate and key files.
  #                  Requires "cert_path" and "key_path" to be set.
  #                  Use this when TLS is already managed by Cloudflare,
  #                  your registrar, AWS ACM, or another tool.
  provider: "self-signed"

  # Domain for certificate provisioning.
  # Required when provider is "letsencrypt".
  # Optional for "self-signed" (scopes the certificate to that hostname).
  domain: ""

  # Certificate and key paths — required when provider is "external".
  cert_path: ""
  key_path: ""

  # Directory where Caddy stores ACME certificates.
  # Uses the Caddy default (~/.local/share/caddy) when empty.
  # Only applies when provider is "letsencrypt".
  storage_path: ""

  # Email address for ACME account registration.
  # Required for ZeroSSL (used for EAB auto-registration).
  # Recommended for Let's Encrypt (receives cert expiry notifications).
  email: ""

  # ACME directory URL to use instead of Let's Encrypt production.
  # Only applies when provider is "letsencrypt".
  # Use the staging URL for testing to avoid rate limits:
  #   acme_ca: "https://acme-staging-v02.api.letsencrypt.org/directory"
  # Other ACME CAs (ZeroSSL, Buypass, etc.) are also supported.
  acme_ca: ""

  # Skip the Let's Encrypt rate-limit preflight check run by "vibew doctor".
  # Set to true after cert revocation when you need to re-issue within the
  # 168-hour window and already know the budget is (temporarily) exhausted.
  # Equivalent to passing --skip-le-preflight on the CLI.
  skip_rate_limit_check: false

  # Certificate expiry monitoring — warns before your certificate expires.
  # VibeWarden checks the expiry of the active TLS certificate in the background
  # and emits structured log events when the certificate is approaching expiry.
  #
  # Events emitted:
  #   tls.cert_monitoring.warning  — when < warning_threshold remains (default: 30 days)
  #   tls.cert_monitoring.critical — when < critical_threshold remains (default: 7 days)
  cert_monitoring:
    # Enable certificate expiry monitoring.
    # Default: true (when tls.enabled is true).
    enabled: true

    # How often the monitor checks certificate expiry.
    # Go duration string. Default: "6h"
    check_interval: "6h"

    # Time-before-expiry that triggers a warning event.
    # Go duration string. Default: "720h" (30 days)
    warning_threshold: "720h"

    # Time-before-expiry that triggers a critical event and degrades the
    # /_vibewarden/health endpoint to "degraded".
    # Go duration string. Default: "168h" (7 days)
    critical_threshold: "168h"

# Ory Kratos (identity/auth) settings
kratos:
  # Kratos public API (user-facing flows). When set, VibeWarden automatically:
  #   1. Validates session cookies against Kratos on every protected request.
  #   2. Proxies all Kratos self-service flow paths to Kratos instead of the
  #      upstream app. This includes:
  #        /self-service/login/*       → Kratos login flow
  #        /self-service/registration/*→ Kratos registration flow
  #        /self-service/logout/*      → Kratos logout
  #        /self-service/settings/*    → Kratos settings
  #        /self-service/recovery/*    → Kratos recovery
  #        /self-service/verification/*→ Kratos verification
  #        /.ory/kratos/public/*       → Ory canonical prefix (alias)
  #
  # Leave empty to disable authentication (not recommended in production).
  #
  # Local binary (running outside Docker):
  public_url: "http://127.0.0.1:4433"
  # Kratos admin API (internal use — not exposed to the internet).
  admin_url: "http://127.0.0.1:4434"
  #
  # Docker Compose dev environment:
  # The VIBEWARDEN_KRATOS_PUBLIC_URL and VIBEWARDEN_KRATOS_ADMIN_URL environment
  # variables in docker-compose.yml override these values so that the container
  # resolves Kratos by its service name on the internal Docker network:
  #
  #   VIBEWARDEN_KRATOS_PUBLIC_URL: http://kratos:4433
  #   VIBEWARDEN_KRATOS_ADMIN_URL:  http://kratos:4434

  # Social login providers (OAuth 2.0 / OIDC).
  #
  # List the provider IDs that are active in your kratos.yml OIDC method config.
  # VibeWarden uses this list for structured log enrichment only — credentials
  # are configured exclusively in kratos.yml, never here.
  #
  # The OAuth callback URL for each provider follows this pattern:
  #   https://<your-domain>/self-service/methods/oidc/callback/<provider-id>
  #
  # See docs/social-login.md for step-by-step setup guides for each provider.
  #
  # social_providers:
  #   - google      # Google OAuth 2.0 — console.cloud.google.com
  #   - github      # GitHub OAuth App — github.com/settings/developers
  #   - apple       # Sign in with Apple — developer.apple.com
  #   - facebook    # Meta / Facebook Login — developers.facebook.com
  #   - microsoft   # Azure AD / Microsoft — portal.azure.com
  #   - keycloak    # Generic OIDC — any provider with an OIDC discovery endpoint
  social_providers: []

# Auth middleware settings
#
# auth.mode selects the authentication strategy. Valid values:
#
#   none     — No authentication. All requests are forwarded to the upstream
#              without any identity check. Use only for fully public apps.
#
#   jwt      — JWT/OIDC bearer token validation. VibeWarden validates
#              "Authorization: Bearer <token>" on every protected request.
#              Recommended for most applications. Works with Auth0, Keycloak,
#              Firebase, Cognito, Okta, Supabase, or any OIDC provider.
#              Configure the jwt sub-section below.
#
#   kratos   — Ory Kratos session-cookie validation. Kratos handles login,
#              registration, MFA, recovery, and social login flows.
#              Requires kratos.public_url to be set.
#
#   api-key  — API key header validation for machine-to-machine requests.
#              Configure the api_key sub-section below.
#
# See docs/identity-providers.md for full configuration guide and
# step-by-step examples for Auth0, Keycloak, Firebase, Cognito, Okta,
# and Supabase.
auth:
  # Authentication mode (default: "none").
  mode: "none"

  # JWT/OIDC settings — used when mode is "jwt".
  #
  # jwt:
  #   # URL to fetch the JSON Web Key Set.
  #   # Mutually exclusive with issuer_url: if both are set, jwks_url wins.
  #   # Example (Auth0):
  #   #   jwks_url: "https://dev-abc123.us.auth0.com/.well-known/jwks.json"
  #   # Example (Firebase):
  #   #   jwks_url: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
  #   jwks_url: ""
  #
  #   # OIDC issuer URL for auto-discovery (used if jwks_url is empty).
  #   # VibeWarden appends /.well-known/openid-configuration to discover the JWKS URL.
  #   # Example (Okta): "https://dev-abc123.okta.com/oauth2/default"
  #   issuer_url: ""
  #
  #   # Expected "iss" claim value. Must match exactly what the provider puts in the token.
  #   # Example (Auth0):   "https://dev-abc123.us.auth0.com/"   (trailing slash required)
  #   # Example (Cognito): "https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_abc123"
  #   issuer: ""
  #
  #   # Expected "aud" claim value. Usually your API identifier or app client ID.
  #   # Example (Auth0):   "https://api.your-app.com"
  #   # Example (Cognito): "<app-client-id>"
  #   audience: ""
  #
  #   # JWT claims to inject as HTTP headers on every upstream request.
  #   # The upstream app reads these headers like any other.
  #   # Array-valued claims (e.g. roles) are joined with a comma.
  #   # Default mapping is used when this section is omitted:
  #   #   sub            → X-User-Id
  #   #   email          → X-User-Email
  #   #   email_verified → X-User-Verified
  #   #
  #   # Extended example:
  #   # claims_to_headers:
  #   #   sub: X-User-Id
  #   #   email: X-User-Email
  #   #   email_verified: X-User-Verified
  #   #   name: X-User-Name
  #   #   roles: X-User-Roles
  #   #   org_id: X-Org-Id
  #   claims_to_headers:
  #     sub: X-User-Id
  #     email: X-User-Email
  #     email_verified: X-User-Verified
  #
  #   # Signing algorithms accepted. Default: [RS256, ES256].
  #   # Never include "none" or HS256 in production.
  #   allowed_algorithms: [RS256, ES256]
  #
  #   # How long to cache JWKS keys locally before re-fetching.
  #   # Accepts Go duration strings: "30m", "1h". Default: "1h".
  #   # Set shorter (e.g. "30m") for Firebase, which rotates keys hourly.
  #   cache_ttl: "1h"

  # API key settings — used when mode is "api-key".
  #
  # api_key:
  #   # Header name the client sends the key in (default: X-API-Key).
  #   header: X-API-Key
  #
  #   # Static pre-shared keys. Store only the SHA-256 hash, never the plaintext.
  #   # Generate: openssl rand -hex 32
  #   # Hash:     echo -n "<key>" | sha256sum
  #   keys:
  #     - name: ci-pipeline
  #       hash: "e3b0c44298fc1c149afb4c8996fb92427ae41e4649b934ca495991b7852b855"
  #       scopes: [deploy, read]
  #     - name: monitoring
  #       hash: "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3"
  #       scopes: [read]
  #
  #   # Load keys from OpenBao instead (recommended for production).
  #   # openbao_path: "auth/api-keys"
  #   # cache_ttl: "5m"
  #
  #   # Scope-based authorization rules (first match wins).
  #   # scope_rules:
  #   #   - path: "/admin/*"
  #   #     required_scopes: [admin]
  #   #   - path: "/api/v1/*"
  #   #     methods: [GET, HEAD]
  #   #     required_scopes: [read]

  # List of URL path glob patterns that bypass authentication entirely.
  # The /_vibewarden/* prefix is always public (health check etc.).
  # Add your app's public routes here. Glob patterns; trailing /* matches the prefix and any subpath. Path-segment-aware: /auth/* matches /auth, /auth/, /auth/login but NOT /auth-evil or /authentic.
  # Example:
  #   public_paths:
  #     - "/static/*"
  #     - "/favicon.ico"
  #     - "/robots.txt"
  public_paths: []

  # Cookie name used by Kratos for session tokens.
  # Only change this if you have customised your Kratos configuration.
  # Only relevant when mode is "kratos".
  session_cookie_name: "ory_kratos_session"

  # URL to redirect unauthenticated users to.
  # Defaults to /self-service/login/browser (Kratos browser login flow).
  # Only relevant when mode is "kratos".
  login_url: ""

  # When true, generates a seed-users.sh script that creates demo Kratos
  # identities (demo@vibewarden.dev, alice@vibewarden.dev) on first deploy.
  # Only useful for demos/testing — never enable in production.
  # Requires auth.mode: kratos and kratos.external: false.
  # Default: false.
  # seed_demo_users: false

  # Role-based path restrictions (only valid when mode is "kratos").
  #
  # Maps role names to URL path patterns. Authenticated users whose Kratos
  # identity trait "role" does not match the required role for a path receive
  # HTTP 403 Forbidden with JSON body:
  #   {"error":"forbidden","message":"insufficient role for this path"}
  #
  # When role_paths is omitted or empty, no role enforcement is performed —
  # the X-User-Role header is still set for the upstream app to use.
  #
  # Accepted roles: user, admin, moderator (matches the identity schema trait).
  # A trailing /* does prefix matching (e.g. /admin/* matches /admin/users/edit).
  #
  # Example:
  #   role_paths:
  #     admin:
  #       - /admin/*
  #     moderator:
  #       - /admin/moderation/*
  # role_paths: {}

# Request body size limiting
# VibeWarden can reject oversized request bodies before they reach the upstream.
# This protects against payload-based denial-of-service attacks and enforces
# upload limits without any application-level changes.
#
# Requests with a body larger than the configured limit receive:
#   HTTP 413 Payload Too Large
body_size:
  # Global default maximum request body size.
  # Supported units: B, KB, MB, GB, TB (case-insensitive).
  # Set to "0" or empty to disable the global limit.
  max: "1MB"

  # Per-path overrides — takes precedence over the global max.
  # Useful for upload endpoints that need to accept larger payloads.
  # A path override with max "0" or empty means no limit for that path.
  # Example:
  #   overrides:
  #     - path: /api/upload
  #       max: "50MB"
  #     - path: /api/avatar
  #       max: "5MB"
  overrides: []

# Rate limiting
# VibeWarden enforces two independent token-bucket rate limits:
#   per_ip   — applied to every request, keyed by client IP address.
#   per_user — applied only to authenticated requests, keyed by user ID.
#              Both limits must pass for a request to be forwarded to the upstream.
#
# Requests that exceed a limit receive a 429 Too Many Requests response with:
#   - Retry-After header indicating seconds until the limit resets.
#   - JSON body: {"error":"rate_limit_exceeded","retry_after_seconds":N}
rate_limit:
  # Enable rate limiting (recommended: true in production).
  enabled: true

  # Backing store for rate limit state.
  # "memory" (default) — per-process token bucket. No external dependencies.
  #                      Resets on restart. Suitable for single-instance deployments.
  # "redis"            — Redis-backed distributed token bucket. Shared state
  #                      across restarts and multiple instances. Requires a Redis server.
  store: memory

  # Redis store configuration. Only used when store is "redis".
  #
  # For multi-instance deployments, set store to "redis" and configure this
  # section so all instances share rate limit counters. See docs/rate-limiting.md
  # for a full guide including external provider examples (Upstash, ElastiCache,
  # Redis Cloud).
  #
  # redis:
  #   # Full Redis URL. Takes precedence over address/password/db when set.
  #   # Use redis:// for plain connections, rediss:// for TLS.
  #   # Recommended for external providers — embed all credentials in one string
  #   # and supply it via environment variable to keep secrets out of YAML.
  #   #
  #   # Examples:
  #   #   Local:          redis://localhost:6379/0
  #   #   With password:  redis://:mypassword@localhost:6379/0
  #   #   TLS (Upstash):  rediss://default:${UPSTASH_REDIS_PASSWORD}@<endpoint>.upstash.io:6380
  #   #   ElastiCache:    rediss://:${ELASTICACHE_AUTH_TOKEN}@<endpoint>.cache.amazonaws.com:6379
  #   #   Redis Cloud:    rediss://default:${REDIS_CLOUD_PASSWORD}@redis-<id>.c<num>.eu-west-1-1.ec2.redns.redis-cloud.com:12345
  #   #
  #   # Override via environment variable:
  #   #   VIBEWARDEN_RATE_LIMIT_REDIS_URL=rediss://...
  #   url: ""
  #
  #   # Redis server address in host:port form. Used when url is empty.
  #   # Required when store is "redis" and url is not set.
  #   address: localhost:6379
  #
  #   # Redis AUTH password (leave empty if Redis has no auth configured).
  #   # Ignored when url is set.
  #   password: ""
  #
  #   # Redis logical database index (default: 0).
  #   # Ignored when url is set.
  #   db: 0
  #
  #   # Maximum number of socket connections in the pool.
  #   # Default: 0 (go-redis chooses automatically based on CPU count).
  #   # Set a low value (e.g. 5) for providers with connection limits (Upstash free tier).
  #   pool_size: 0
  #
  #   # Namespace prefix for Redis keys. All keys are stored as:
  #   #   <key_prefix>:ratelimit:<limiter>:<identifier>
  #   key_prefix: vibewarden
  #
  #   # Graceful fallback to in-memory store when Redis is unavailable.
  #   # true  (default) — fail-open: keep rate limiting with in-memory store.
  #   #                   Counters are no longer shared across instances during
  #   #                   the outage but requests are not blocked.
  #   # false           — fail-closed: deny all requests when Redis is unreachable.
  #   #                   Use this when rate limiting correctness is required.
  #   fallback: true
  #
  #   # How often VibeWarden checks whether Redis has recovered after a failure.
  #   # Accepts Go duration strings: "30s", "1m", "5m".
  #   health_check_interval: 30s

  # Per-IP rate limit — applied to ALL requests regardless of authentication.
  per_ip:
    # Sustained request rate allowed per IP address.
    requests_per_second: 10
    # Maximum burst: how many requests may arrive back-to-back before throttling.
    # Should be >= requests_per_second.
    burst: 20

  # Per-user rate limit — applied only to authenticated requests.
  # Higher limits than per_ip are typical because authenticated users are known.
  per_user:
    # Sustained request rate allowed per authenticated user.
    requests_per_second: 100
    # Maximum burst per user.
    burst: 200

  # Enable to read X-Forwarded-For for the real client IP.
  # Only enable when VibeWarden sits behind a trusted reverse proxy (e.g. Nginx, Cloudflare).
  # Leave false when VibeWarden is the outermost edge server to prevent IP spoofing.
  trust_proxy_headers: false

  # URL path glob patterns that bypass rate limiting entirely.
  # The /_vibewarden/* prefix (health check etc.) is always exempt.
  # A trailing /* does prefix matching (e.g. "/static/*" matches "/static/css/main.css").
  # Example:
  #   exempt_paths:
  #     - "/public/*"
  #     - "/favicon.ico"
  exempt_paths: []

# Logging
log:
  # Level: debug, info, warn, error
  level: "info"
  # Format: json (recommended) or text
  format: "json"
  # Enable access logging of every completed HTTP request.
  # When true, each request is logged at INFO level with method, path, status,
  # duration, client IP, request ID, user agent, and bytes written.
  # Default: true
  access_log: true

# Admin API (for user management, metrics, etc.)
admin:
  # Enable admin API
  enabled: false
  # Bearer token for authentication (use env var VIBEWARDEN_ADMIN_TOKEN in production)
  token: ""

# DEPRECATED: Use telemetry: section instead.
# This section remains for backward compatibility. Settings are automatically
# migrated to telemetry: at startup with a deprecation warning.
# This section will be removed in a future major version.
#
# Prometheus metrics
# VibeWarden exposes a Prometheus-compatible metrics endpoint at /_vibewarden/metrics.
# An internal HTTP server is started on a random localhost port; Caddy reverse-proxies
# /_vibewarden/metrics to it so the metrics handler never handles TLS or auth directly.
#
# Scraped metrics include:
#   vibewarden_requests_total            — request counter (labels: method, status_code, path_pattern)
#   vibewarden_request_duration_seconds  — request duration histogram (labels: method, path_pattern)
#   vibewarden_rate_limit_hits_total     — rate limit hits (labels: limit_type: ip|user)
#   vibewarden_auth_decisions_total      — auth decisions (labels: decision: allowed|blocked)
#   vibewarden_upstream_errors_total     — upstream connection errors
#   vibewarden_active_connections        — current number of active proxy connections
#   go_*                                 — Go runtime metrics
#   process_*                            — process metrics
metrics:
  # Enable metrics endpoint at /_vibewarden/metrics (recommended: true)
  enabled: true
  # Path normalization patterns (moved to telemetry.path_patterns)
  path_patterns: []

# Telemetry configuration
# VibeWarden uses OpenTelemetry as its telemetry foundation. This section controls
# all metrics and log export behavior.
#
# Export modes:
#   - Prometheus-only (default): Metrics scraped at /_vibewarden/metrics
#   - OTLP-only: Metrics pushed to OTLP endpoint (no local metrics endpoint)
#   - Dual-export: Both Prometheus scraping and OTLP push active
#
# See docs/observability.md for full configuration guide.
telemetry:
  # Master switch for telemetry collection (default: true)
  enabled: true

  # URL path normalization patterns using :param syntax.
  # Configure the routes your app exposes to prevent high-cardinality labels.
  # Example:
  #   path_patterns:
  #     - "/users/:id"
  #     - "/api/v1/items/:item_id/comments/:comment_id"
  path_patterns: []

  # Prometheus pull-based exporter (metrics served at /_vibewarden/metrics)
  prometheus:
    # Enable Prometheus exporter (default: true)
    # When enabled, metrics are available at /_vibewarden/metrics in Prometheus format.
    enabled: true

  # OTLP push-based exporter (metrics pushed to collector/backend)
  otlp:
    # Enable OTLP exporter (default: false)
    # Requires endpoint to be set.
    enabled: false

    # OTLP HTTP endpoint URL.
    # Examples:
    #   Local collector: http://localhost:4318
    #   Docker Compose:  http://otel-collector:4318
    #   Grafana Cloud:   https://otlp-gateway-prod-us-central-0.grafana.net/otlp
    endpoint: ""

    # HTTP headers for OTLP requests (e.g., authentication).
    # Example:
    #   headers:
    #     Authorization: "Basic ${GRAFANA_OTLP_TOKEN}"
    headers: {}

    # Export interval — how often metrics are batched and pushed (default: 30s).
    # Shorter intervals reduce telemetry lag but increase network overhead.
    interval: "30s"

    # Transport protocol: "http" (supported) or "grpc" (reserved for future).
    protocol: "http"

  # Structured event log export
  logs:
    # Enable OTLP log export (default: false).
    # When enabled, structured events (AI-readable logs) are exported to the same
    # OTLP endpoint as metrics. Logs are also written to stdout (unchanged behavior).
    # Requires telemetry.otlp.endpoint to be configured.
    otlp: false

  # Distributed tracing settings
  traces:
    # Enable distributed tracing (default: false).
    # When enabled, a span is created for each HTTP request and exported via OTLP.
    # Requires telemetry.otlp.enabled to be true and telemetry.otlp.endpoint to be set.
    enabled: false

# CORS (Cross-Origin Resource Sharing)
# Injects Access-Control-* headers and handles OPTIONS preflight requests.
# Enable this when your app is served from a different origin than the browser app
# (e.g. API at api.example.com accessed by frontend at app.example.com).
cors:
  # Enable CORS middleware (default: false)
  enabled: false
  # Origins allowed to make cross-origin requests.
  # Use ["*"] for development (all origins). Never use "*" with allow_credentials: true.
  allowed_origins:
    - "https://example.com"
  # HTTP methods allowed in cross-origin requests
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  # Request headers allowed in cross-origin requests
  allowed_headers: ["Content-Type", "Authorization"]
  # Response headers exposed to the browser (Access-Control-Expose-Headers)
  exposed_headers: []
  # Set Access-Control-Allow-Credentials: true.
  # Must not be combined with allowed_origins: ["*"].
  allow_credentials: false
  # Seconds to cache preflight response (0 omits Access-Control-Max-Age)
  max_age: 0

# Web Application Firewall (WAF)
# VibeWarden's built-in WAF inspects every inbound request for common attack
# patterns before forwarding it to the upstream application.  No external
# dependency is required — all detection runs in-process.
#
# Attack categories detected:
#   sqli             — SQL injection payloads in query strings and request bodies
#   xss              — Cross-site scripting payloads
#   path_traversal   — Directory traversal sequences (e.g. "../..")
#   command_injection — Shell metacharacters and command-chaining patterns
#
# When a request matches an active rule, VibeWarden responds with:
#   HTTP 200 forwarded     (mode: detect, default — request passes through, attack is logged)
#   HTTP 400 Bad Request   (mode: block            — request is rejected)
#
waf:
  # Enable the WAF middleware (default: true — enabled in detect mode).
  enabled: true

  # Detection mode controls what happens when a rule fires.
  # "detect" — pass the request through but emit a structured log event (default).
  #            Use detect mode to audit traffic before switching to block.
  # "block"  — reject the request with 400 Bad Request (recommended for production).
  # "log"    — alias for detect; kept for compatibility with staging configs.
  mode: detect

  # Suppress the vibew validate FAIL that fires when WAF is enabled with
  # mode: log in a production config (vibewarden.production.yaml).
  # Set to true only when log mode is intentional for a production rollout.
  # The check still emits an OK row so the acknowledgement is visible.
  # Default: false.
  acknowledge_log_mode: false

  # Content-Type validation — rejects requests whose Content-Type is not in the
  # allowed list with 415 Unsupported Media Type.
  content_type_validation:
    # Enable Content-Type validation on body-bearing requests (default: false).
    enabled: false
    # Media types accepted for request bodies. Requests with any other
    # Content-Type receive 415 Unsupported Media Type.
    allowed:
      - application/json
      - application/x-www-form-urlencoded
      - multipart/form-data

  # Per-rule toggles. Each rule is enabled by default when waf.enabled is true.
  # Set a rule to false to skip that check while keeping all others active.
  rules:
    # Detect SQL injection patterns in query strings and request bodies.
    sqli: true
    # Detect cross-site scripting payloads.
    xss: true
    # Detect directory traversal sequences (e.g. ../../etc/passwd).
    path_traversal: true
    # Detect shell command-injection metacharacters.
    command_injection: true

# Security headers added to all proxied responses
security_headers:
  # Enable security headers middleware (recommended: true)
  enabled: true
  # Strict-Transport-Security max-age in seconds (default: 31536000 = 1 year)
  # HSTS is only sent over HTTPS connections — ignored on plain HTTP
  hsts_max_age: 31536000
  # Include the includeSubDomains directive in HSTS
  hsts_include_subdomains: true
  # Include the preload directive (requires manual submission to browser preload lists)
  hsts_preload: false
  # Set X-Content-Type-Options: nosniff
  content_type_nosniff: true
  # Set X-Frame-Options: "DENY", "SAMEORIGIN", or "" to disable
  frame_option: "DENY"
  # Content-Security-Policy value (empty string disables the header — the default).
  # CSP is disabled by default because "default-src 'self'" breaks most real apps
  # (inline styles, external fonts, CDN scripts, etc.).  Set an explicit policy
  # once you know your app's requirements, e.g.:
  #   content_security_policy: "default-src 'self'; style-src 'self' 'unsafe-inline'"
  content_security_policy: ""
  # Referrer-Policy value (empty string disables the header)
  referrer_policy: "strict-origin-when-cross-origin"
  # Permissions-Policy value (empty string disables the header)
  # An empty value means no browser features are explicitly allowed or denied
  # via this header; set to e.g. "camera=(), microphone=()" to restrict specific features.
  permissions_policy: ""
  # Cross-Origin-Opener-Policy — isolates the browsing context from cross-origin
  # documents. "same-origin" is the most restrictive safe default.
  cross_origin_opener_policy: "same-origin"
  # Cross-Origin-Resource-Policy — prevents other origins from loading this
  # resource in a no-cors cross-origin request.
  cross_origin_resource_policy: "same-origin"
  # X-Permitted-Cross-Domain-Policies — instructs Adobe Flash/PDF clients not
  # to allow cross-domain requests. "none" disables all cross-domain access.
  permitted_cross_domain_policies: "none"
  # Suppress the Via header that Caddy's reverse proxy adds to forwarded
  # responses. Suppressing it reduces information disclosure about the proxy.
  suppress_via_header: true

# Secret management
# VibeWarden provides built-in encrypted secret storage by default (AES-256-GCM).
# No external containers needed. For dynamic credentials, opt into OpenBao.
#
# See docs/secret-management.md for full setup guide.
#
# Quick start (built-in):
#   1. export VIBEWARDEN_SECRETS_MASTER_KEY=$(openssl rand -hex 32)
#   2. vibew secret set app/myapp api_key=<your-key>
#   3. Enable this plugin and configure injection below.
#   4. vibew dev
# Egress proxy configuration
#
# When enabled, the egress proxy listens on a dedicated localhost port and
# forwards outbound HTTP requests from the wrapped application to external
# services. Only routes listed in the allowlist are permitted; all others are
# blocked by default (default_policy: deny).
#
# The wrapped application should send outbound API calls to the egress proxy
# instead of directly to the internet:
#
#   export HTTP_PROXY=http://127.0.0.1:8081
#   export HTTPS_PROXY=http://127.0.0.1:8081
#
# Or use named-route addressing for explicit control:
#
#   POST http://127.0.0.1:8081/_egress/stripe-api/v1/charges
#
# Features per route:
#   - Secret injection: fetch an API key from OpenBao and inject it as a header
#   - Rate limiting: per-route token-bucket rate limiter
#   - Circuit breaking: automatically open the circuit on repeated failures
#   - Retries with exponential backoff
#   - SSRF protection: block requests to private/loopback IPs
#
egress:
  # Enable the egress proxy plugin (default: false)
  enabled: false

  # TCP address the egress proxy binds to (default: "127.0.0.1:8081")
  listen: "127.0.0.1:8081"

  # Disposition for outbound requests that do not match any configured route.
  # Accepted values: "allow", "deny" (default: "deny")
  default_policy: deny

  # Permit plain HTTP egress requests globally (default: false).
  # Individual routes can override this with their own allow_insecure field.
  allow_insecure: false

  # Global request timeout applied when a route does not specify its own timeout.
  # Go duration string (e.g. "30s", "1m"). Default: "30s".
  default_timeout: "30s"

  # Global maximum request body size. Human-readable string (e.g. "50MB").
  # Empty means no global limit. Routes can override with body_size_limit.
  # default_body_size_limit: "50MB"

  # Global maximum response body size. Human-readable string (e.g. "50MB").
  # Empty means no global limit. Routes can override with response_size_limit.
  # default_response_size_limit: "50MB"

  # DNS-level SSRF protection settings.
  dns:
    # Block requests to private, loopback, and reserved IP addresses.
    # Mitigates SSRF attacks. Default: true.
    block_private: true

    # CIDR ranges exempt from block_private.
    # Use this to allow egress to specific internal services in a private network.
    # Example: ["10.0.0.0/8", "192.168.100.0/24"]
    allowed_private: []

  # Egress route allowlist.
  # Routes are evaluated in declaration order; the first matching route wins.
  # Each route must have a unique name and a URL glob pattern.
  routes: []
  # Example routes:
  #
  # routes:
  #   # Stripe API — POST only, with secret injection and circuit breaking
  #   - name: stripe-api
  #     pattern: "https://api.stripe.com/**"
  #     methods: ["POST"]
  #     timeout: "10s"
  #
  #     # Inject an OpenBao secret as the Authorization header.
  #     # Requires the secrets plugin to be enabled.
  #     secret: app/stripe
  #     secret_header: Authorization
  #     secret_format: "Bearer {value}"
  #
  #     # Per-route rate limiting (100 requests per second).
  #     rate_limit: "100/s"
  #
  #     # Circuit breaker: open after 5 consecutive failures, probe after 30 s.
  #     circuit_breaker:
  #       threshold: 5
  #       reset_after: "30s"
  #
  #     # Retry up to 3 times with exponential backoff on transient errors.
  #     retries:
  #       max: 3
  #       backoff: exponential
  #
  #   # GitHub API — GET and POST, no secret injection
  #   - name: github-api
  #     pattern: "https://api.github.com/**"
  #     methods: ["GET", "POST"]
  #     timeout: "15s"
  #     rate_limit: "500/m"
  #
  #   # Internal service on a private network — requires block_private: false
  #   # or adding the CIDR to allowed_private above.
  #   - name: internal-payments
  #     pattern: "http://payments.internal/**"
  #     allow_insecure: true
  #
  #   # mTLS route — present a client certificate to the upstream.
  #   # cert_path and key_path are required; ca_path is optional (uses system roots when empty).
  #   - name: payment-processor
  #     pattern: "https://payments.example.com/**"
  #     mtls:
  #       cert_path: "/etc/vibewarden/certs/client.crt"
  #       key_path:  "/etc/vibewarden/certs/client.key"
  #       ca_path:   "/etc/vibewarden/certs/payments-ca.crt"
  #
  #   # Prompt injection detection — scan outbound LLM API request bodies.
  #   # When enabled, request bodies are scanned before being forwarded upstream.
  #   # Action "block" (default) rejects the request with 400; "detect" logs and passes through.
  #   - name: openai-api
  #     pattern: "https://api.openai.com/**"
  #     prompt_injection:
  #       enabled: true
  #       content_paths:
  #         - ".messages[].content"  # JSON path(s) to extract text for scanning
  #         - ".prompt"
  #       extra_patterns: []         # additional regex patterns (case-insensitive)
  #       action: block              # "block" (default) or "detect"

secrets:
  # Enable the secrets plugin (default: false)
  enabled: false

  # Secret store backend: "builtin" (default) or "openbao"
  store: builtin

  # Built-in encrypted file store settings.
  # The master key must be provided via VIBEWARDEN_SECRETS_MASTER_KEY env var
  # (hex-encoded 32 bytes) or via the key_file option below.
  # builtin:
  #   # Path to the encrypted secrets file (default: ".vibewarden/secrets.enc")
  #   path: ".vibewarden/secrets.enc"
  #   # Path to a file containing the hex-encoded master key.
  #   # If empty, the VIBEWARDEN_SECRETS_MASTER_KEY env var is used.
  #   key_file: ""

  # OpenBao connection settings (used when store is "openbao")
  # To use OpenBao, set store: openbao and uncomment this section.
  # openbao:
  #   # OpenBao server URL. Inside Docker Compose use the container name.
  #   # Set via VIBEWARDEN_SECRETS_OPENBAO_ADDRESS env var.
  #   address: "http://openbao:8200"
  #
  #   auth:
  #     # Auth method: "token" (dev/simple) or "approle" (recommended for production)
  #     method: token
  #
  #     # Static token — only for dev mode. Set via VIBEWARDEN_SECRETS_OPENBAO_AUTH_TOKEN.
  #     token: "${OPENBAO_DEV_TOKEN:-vibewarden-dev}"
  #
  #     # AppRole credentials — for production use.
  #     # Generated by the openbao-bootstrap container; see docs/secret-management.md.
  #     # role_id: "${OPENBAO_ROLE_ID}"
  #     # secret_id: "${OPENBAO_SECRET_ID}"
  #
  #   # KV v2 mount path (default: "secret")
  #   mount_path: secret

  # Secret injection configuration
  inject:
    # Inject secrets as HTTP request headers on every proxied request.
    # The upstream app receives these headers like any other request header.
    #
    # Simple example (secret value used directly):
    #   headers:
    #     - secret_path: app/internal-api
    #       secret_key: token
    #       header: X-Internal-Token
    #
    # Composite example (secret embedded in a larger string via value_template):
    #   headers:
    #     - secret_path: app/auth
    #       secret_key: token
    #       header: Authorization
    #       value_template: "Bearer ${secret://app/auth/token}"
    headers: []

    # Write secrets to a .env file that the upstream app reads at startup.
    # The file is written with 0600 permissions.
    # Set to empty string to disable env file writing.
    env_file: ""

    # Secrets to write into the env file.
    #
    # Simple example (secret value used directly):
    #   env:
    #     - secret_path: app/database
    #       secret_key: password
    #       env_var: DATABASE_PASSWORD
    #
    # Composite example (secret embedded in a connection string):
    #   env:
    #     - secret_path: app/database
    #       secret_key: password
    #       env_var: DATABASE_URL
    #       value_template: "postgres://user:${secret://app/database/password}@host:5432/db"
    env: []

  # Dynamic Postgres credentials via OpenBao's database engine.
  # OpenBao generates short-lived credentials that VibeWarden rotates automatically.
  # Requires the database engine to be configured — see docs/secret-management.md.
  dynamic:
    postgres:
      # Enable dynamic Postgres credential generation (default: false)
      enabled: false

      # OpenBao database roles to request credentials for.
      # Example:
      #   roles:
      #     - name: app-readwrite
      #       env_var_user: DATABASE_USER
      #       env_var_password: DATABASE_PASSWORD
      roles: []

  # How long to cache static secrets in memory (default: 5m).
  # VibeWarden re-fetches in the background and serves stale if refresh fails.
  cache_ttl: "5m"

  # Secret health check configuration
  health:
    # How often to run health checks (default: 6h)
    check_interval: "6h"

    # Maximum acceptable age for a static secret before a stale warning is emitted.
    # Default: 2160h (90 days)
    max_static_age: "2160h"

    # Substrings that indicate a weak/default secret value (case-insensitive).
    weak_patterns:
      - "password"
      - "changeme"
      - "secret"
      - "123456"
      - "admin"
      - "letmein"

# Deploy settings — consumed by `vibew bundle`, not by `vibewarden serve`.
# These fields describe the deploy *target* and have no effect on the running sidecar.
deploy:
  # Target platform for `vibew bundle`, in the Docker Buildx format "<os>/<arch>".
  # The bundle aborts with an actionable rebuild command when the bundled image's
  # architecture does not match this value.
  #
  # Hetzner VMs and most cloud VPS targets are linux/amd64.
  # Apple Silicon development machines produce linux/arm64 images by default.
  # Override on the command line with: vibew bundle --target-platform linux/arm64
  #
  # Default: linux/amd64
  target_platform: linux/amd64

  # SSH target substituted (single-quoted) into the "Next: deploy" block printed
  # by `vibew bundle` and into the bundle README's fenced deploy commands.
  # Validated against an allowlist at config-load time (no shell metacharacters).
  # Accepted forms: user@host, ~/.ssh/config alias (no @), bare IPv4, host:port,
  # user@host:port. Shell metacharacters (;, &, |, $, backtick, quotes, etc.)
  # are rejected with a clear error.
  #
  # When unset (default), the three ssh lines use the bracketed placeholder
  # `<your-ssh-user>@<your-ssh-host>` and a hint paragraph is appended.
  #
  # Per-invocation override: `vibew bundle --print-deploy --host <h> --user <u>
  # --path <p>` overrides this field for the stdout block only (bundle README is
  # unaffected). Use --print-deploy for CI pipelines or one-off multi-host deploys
  # without modifying this file.
  #
  # Default: "" (use bracketed placeholder)
  # host: alice@vps.example.com

# Upstream resilience — timeout, circuit breaker, and retry.
# Controls what happens when the upstream is slow or failing.
resilience:
  # Maximum time to wait for the upstream application to respond.
  # A value of "0" or "" disables the timeout (no limit — not recommended).
  # Go duration string. Default: "30s"
  timeout: "30s"

  # Circuit breaker — automatically stop sending requests to a failing upstream.
  # When Open, requests fail fast with 503 without hitting the upstream.
  # After Timeout, one probe request is allowed (HalfOpen). On success, the
  # circuit closes; on failure, the timer resets.
  circuit_breaker:
    # Enable the circuit breaker middleware. Default: false
    enabled: false

    # Consecutive failures required to trip the circuit from Closed to Open.
    # Must be > 0 when enabled. Default: 5
    threshold: 5

    # How long the circuit stays Open before allowing a probe request.
    # Go duration string. Default: "60s"
    timeout: "60s"

  # Retry with exponential backoff — retry idempotent upstream requests on
  # transient errors before returning an error to the client.
  retry:
    # Enable the retry middleware. Default: false
    enabled: false

    # Total number of attempts including the initial request.
    # Must be >= 2 when enabled. Default: 3
    max_attempts: 3

    # Wait before the first retry. Go duration string. Default: "100ms"
    backoff: "100ms"

    # Upper bound on computed backoff. Go duration string. Default: "10s"
    max_backoff: "10s"

    # HTTP status codes that trigger a retry.
    # Default: [502, 503, 504]
    retry_on: [502, 503, 504]

# Webhooks — deliver VibeWarden structured events to external endpoints.
# Useful for alerting, audit pipelines, and SIEM integration.
#
# Example: send security events to a Slack webhook and an audit log service.
#
# webhooks:
#   endpoints:
#     - url: "https://hooks.slack.com/services/T000/B000/xxx"
#       events: ["waf.detection", "auth.blocked", "rate_limit.exceeded"]
#       format: slack   # Accepted values: raw (default), slack, discord
#       timeout_seconds: 10
#     - url: "https://audit.example.com/events"
#       events: ["*"]
#       format: raw
#       timeout_seconds: 5
webhooks:
  # List of outbound webhook endpoints. Default: []
  endpoints: []

  # Inbound webhook signature verification.
  # Protects webhook receiver endpoints from unauthenticated senders.
  # When enabled, requests to listed paths must carry a valid HMAC signature
  # in the provider-specific header.
  signature_verification:
    # Enable inbound signature verification. Default: false
    enabled: false

    # Per-path signature rules (evaluated in order).
    # Example:
    #   paths:
    #     - path: /webhooks/stripe
    #       provider: stripe
    #       secret_env_var: STRIPE_WEBHOOK_SECRET
    #     - path: /webhooks/github
    #       provider: github
    #       secret_env_var: GITHUB_WEBHOOK_SECRET
    #     - path: /webhooks/custom
    #       provider: generic
    #       secret_env_var: MY_WEBHOOK_SECRET
    #       header: X-Hub-Signature-256
    #
    # Accepted providers: stripe, github, slack, twilio, generic
    paths: []

# Overrides — escape hatches for advanced users.
# Paths here tell VibeWarden to use hand-crafted config files instead of
# auto-generating them. Only set a field when you need full control over
# the corresponding file. Most projects do not need this section.
#
# overrides:
#   # Path to a custom kratos.yml. When set, VibeWarden mounts this file into
#   # the Kratos container instead of generating one from the auth.* settings.
#   kratos_config: "./config/kratos.yml"
#
#   # Path to a custom docker-compose.yml. When set, `vibew generate` writes
#   # this file verbatim rather than generating one from vibewarden.yaml.
#   compose_file: "./docker-compose.override.yml"
#
#   # Path to a custom Kratos identity schema JSON file. When set, this
#   # overrides the preset selected by auth.identity_schema.
#   identity_schema: "./config/identity.schema.json"
overrides:
  # Path to a custom kratos.yml. Default: "" (auto-generate)
  kratos_config: ""

  # Path to a custom docker-compose.yml. Default: "" (auto-generate)
  compose_file: ""

  # Path to a custom Kratos identity schema JSON file. Default: "" (use preset)
  identity_schema: ""

# Observability stack — optional Prometheus, Grafana, Loki, and Promtail
# containers generated under the "observability" Docker Compose profile.
# Start with: docker compose --profile observability up -d
#
# This section controls port bindings and data retention. For exporting
# metrics to an external backend, configure telemetry.otlp instead.
#
# See docs/observability.md for a full setup guide.
observability:
  # Enable the observability stack (default: false).
  # When true, `vibew generate` adds Prometheus, Grafana, Loki, Promtail,
  # and OTel Collector services under the "observability" Compose profile.
  enabled: false

  # Host port for Grafana (default: 3001).
  # Avoids conflict with common app ports like 3000.
  grafana_port: 3001

  # Host port for Prometheus (default: 9090).
  prometheus_port: 9090

  # Host port for Loki (default: 3100).
  loki_port: 3100

  # How long Loki retains log data in days (default: 7).
  retention_days: 7

# Audit log — security-relevant event sink.
# VibeWarden emits structured JSONL audit events for authentication decisions,
# WAF detections, rate limit hits, and admin API calls. By default these appear
# in the standard log output (alongside all other log lines).
#
# Use this section to redirect audit events to a dedicated file or to disable
# them entirely for environments where audit logging is handled externally.
audit:
  # Enable the audit log sink. Default: true
  # When true, every security-relevant event is written to the configured output.
  enabled: true

  # Destination for audit events.
  # Accepted values:
  #   "stdout"       — write JSONL to standard output (default, mixed with slog output)
  #   <file path>   — append JSONL to this file (created on first write, 0600 permissions)
  #
  # Default: "stdout"
  output: "stdout"

# Input validation — enforce request size limits before the upstream sees them.
# Rejects oversized URLs, query strings, and headers with 400 Bad Request.
# Complements body_size (which handles the request body).
#
# Use this to harden against denial-of-service via crafted long URLs and
# excessive header counts.
input_validation:
  # Enable the input validation middleware. Default: false
  enabled: false

  # Maximum raw request URI length in bytes (path + query string).
  # Zero disables this check. Default: 2048
  max_url_length: 2048

  # Maximum query string length in bytes (not including the leading "?").
  # Zero disables this check. Default: 2048
  max_query_string_length: 2048

  # Maximum number of request headers allowed per request.
  # Zero disables this check. Default: 100
  max_header_count: 100

  # Maximum byte length of any single header value.
  # Zero disables this check. Default: 8192
  max_header_size: 8192

  # Per-path overrides — first matching entry wins.
  # Non-zero fields override the global limits for requests matching the path glob.
  # Example:
  #   path_overrides:
  #     - path: "/api/upload"
  #       max_url_length: 4096
  #     - path: "/static/*"
  #       max_header_count: 50
  path_overrides: []

# Error pages — serve custom HTML or JSON error bodies for specific HTTP status codes.
# When enabled, VibeWarden serves files from `directory` instead of the default
# JSON error body for auth failures, rate limit rejections, WAF blocks, etc.
#
# File naming convention: <status_code>.<ext>
#   - 401.html, 403.html, 429.html, 503.html
#   - 400.json, 503.json
# Content-Type is inferred from the file extension.
# When no file matches a status code, VibeWarden falls back to its built-in JSON response.
#
# error_pages:
#   enabled: true
#   directory: "./error-pages"
error_pages:
  # Enable custom error pages. Default: false
  enabled: false

  # Path to the directory containing custom error page files.
  # Required when enabled is true.
  # Default: "" (required when enabled)
  directory: ""

# Maintenance mode — return 503 Service Unavailable for all requests.
# Useful for planned downtime, database migrations, and deployments.
# /_vibewarden/* paths (health check, metrics) are always exempt.
#
# Enable at runtime via: VIBEWARDEN_MAINTENANCE_ENABLED=true
maintenance:
  # Enable maintenance mode. Default: false
  enabled: false

  # Message returned to clients in the 503 response body.
  # Default: "Service is under maintenance"
  message: "Service is under maintenance"

# Response compression — compress outbound response bodies.
# VibeWarden negotiates the best algorithm with the client via Accept-Encoding.
# Compression is enabled by default — it reduces bandwidth and improves latency
# for text responses (HTML, JSON, CSS, JS) at minimal CPU cost.
compression:
  # Enable response compression. Default: true
  enabled: true

  # Ordered list of compression algorithms to offer.
  # Caddy picks the first algorithm the client's Accept-Encoding supports.
  # Valid values: "zstd", "gzip"
  # Default: ["zstd", "gzip"]
  algorithms: ["zstd", "gzip"]

# Response headers — inject, overwrite, or remove headers on every proxied response.
# Applied after all other middleware including security_headers.
# Use this for custom branding headers, cache-control directives, or removing
# server-identification headers that security_headers does not cover.
#
# Operations are applied in order: remove → set → add.
#
# response_headers:
#   set:
#     Cache-Control: "no-store"
#     X-Powered-By: "vibewarden"
#   add:
#     Vary: "Accept-Encoding"
#   remove:
#     - X-AspNet-Version
#     - X-Generator
response_headers:
  # Headers to overwrite (or create when absent). Default: {}
  set: {}

  # Headers to append (or create when absent). Default: {}
  add: {}

  # Header names to remove from every response. Default: []
  remove: []

# Health endpoint — /_vibewarden/health response settings.
#
# Controls what the sidecar discloses on its public health endpoint.
# The endpoint is always reachable (it is in the public_paths prefix
# /_vibewarden/*) because load balancers and container orchestrators use
# it as a liveness probe.
#
# OWASP A05 (Security Misconfiguration): exposing the exact binary version
# aids targeted CVE exploitation. Set expose_version: false in production
# to omit the version field. Port-ownership detection (vibew doctor) uses
# the stable X-Vibewarden response header instead, so this setting has no
# effect on internal tooling.
health:
  # Whether to include the "version" field in the /_vibewarden/health JSON
  # response. Default: true (backward-compatible).
  #
  # Set to false to suppress the version string (OWASP A05 hardening). The
  # X-Vibewarden: 1 response header is always present regardless of this
  # setting and is used by vibew doctor for port-ownership detection.
  expose_version: true

# Config file watcher — hot reload vibewarden.yaml without restarting.
# When a change is detected, VibeWarden re-reads and validates the config.
# If the new config is invalid, the reload is rejected and the current config
# remains active (a structured error event is emitted).
watch:
  # Enable config file watching. Default: true
  enabled: true

  # How long to wait after the last file change before triggering a reload.
  # Prevents rapid successive reloads during editor saves.
  # Go duration string. Default: "500ms"
  debounce: "500ms"
