name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Detect if only docs/config files changed (no Go code)
# Used to skip heavy jobs on docs-only PRs.

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'Dockerfile*'
              - '**/requirements*.txt'
              - '**/package*.json'
              - '**/.nvmrc'
              - '**/pyproject.toml'
              - '.github/workflows/**'
              - 'internal/**'
              - 'cmd/**'
              - 'test/**'
              - 'examples/**/*.go'
              - 'npm/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'

  docs-build:
    name: Docs build (mkdocs --strict)
    needs: [changes]
    # The `Deploy docs to vibewarden.dev` workflow only runs on push to main, so a
    # broken link merged into main silently froze the published site for months
    # (#1476). Build the site on every docs-touching PR with the same strict flags.
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs Material and dependencies
        # Keep this list in sync with .github/workflows/docs.yml.
        run: |
          pip install \
            mkdocs-material==9.5.* \
            mkdocs-minify-plugin \
            pymdown-extensions

      - name: Build docs
        run: mkdocs build --strict --site-dir _site/docs

  lint:
    name: Lint
    needs: [changes]
    # Run when path filter detects code change OR when Dependabot opened the PR.
    # Defense in depth — any future ecosystem added to dependabot.yml that
    # isn't in the path filter still gets the full check suite. See #1173.
    if: needs.changes.outputs.code == 'true' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  build-and-test:
    name: Build & Test
    needs: [changes]
    # Run when path filter detects code change OR when Dependabot opened the PR.
    # Defense in depth — any future ecosystem added to dependabot.yml that
    # isn't in the path filter still gets the full check suite. See #1173.
    if: needs.changes.outputs.code == 'true' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build
        run: go build ./...

      - name: Build demo-app
        run: cd examples/demo-app && go build ./...

      - name: Run tests
        run: go test -race ./...

      - name: Run demo-app tests
        run: cd examples/demo-app && go test -race ./...

      - name: Run coverage
        run: |
          PKGS=$(go list ./internal/domain/... ./internal/app/...)
          go test -coverprofile=coverage.out -covermode=atomic $PKGS

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !($COVERAGE < 80) }"; then
            echo "Coverage ${COVERAGE}% is below the required 80% threshold"
            exit 1
          fi
          echo "Coverage threshold met: ${COVERAGE}% >= 80%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  npm-package:
    name: npm package tests
    needs: [changes]
    # The @vibewarden/cli wrapper (ADR-112) is stdlib-only Node; its tests run
    # here on every PR, not just in the release job that publishes it.
    if: needs.changes.outputs.code == 'true' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test package
        run: node --test 'npm/test/*.test.js'

  integration:
    name: Integration Tests
    needs: [changes]
    # Run when path filter detects code change OR when Dependabot opened the PR.
    # Defense in depth — any future ecosystem added to dependabot.yml that
    # isn't in the path filter still gets the full check suite. See #1173.
    if: needs.changes.outputs.code == 'true' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build VibeWarden Docker image (local test tag — never pushed)
        run: docker build --tag vibewarden:local-test .

      - name: Run integration tests
        run: go test -race -tags integration ./test/integration/ -v -timeout 300s
