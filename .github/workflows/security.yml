name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required for SARIF upload to GitHub Security tab

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'Dockerfile*'
              - '**/requirements*.txt'
              - '**/package*.json'
              - '**/.nvmrc'
              - '**/pyproject.toml'
              - '.github/workflows/**'

  semgrep:
    name: Semgrep SAST
    needs: [changes]
    # Run when path filter detects code change OR when Dependabot opened the PR.
    # Defense in depth — any future ecosystem added to dependabot.yml that
    # isn't in the path filter still gets the full check suite. See #1173.
    if: needs.changes.outputs.code == 'true' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.121.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/golang \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --severity ERROR \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy Vulnerability Scan
    needs: [changes]
    # Run when path filter detects code change OR when Dependabot opened the PR.
    # Defense in depth — any future ecosystem added to dependabot.yml that
    # isn't in the path filter still gets the full check suite. See #1173.
    if: needs.changes.outputs.code == 'true' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3

      - name: Run Trivy filesystem scan (dependencies)
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-fs.sarif \
            --exit-code 1 \
            --ignorefile .trivyignore \
            --skip-dirs examples \
            .

      - name: Upload Trivy filesystem SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vibewarden:scan
          # No build cache: the runtime stage runs `apk upgrade`, and a cached
          # layer would pin tag-time package versions, hiding OS CVEs that were
          # patched upstream after the layer was cached (e.g. libcrypto3/libssl3
          # CVE-2026-45447). A fresh build each scan picks up current packages.
          no-cache: true

      - name: Run Trivy image scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-image.sarif \
            --exit-code 1 \
            --ignorefile .trivyignore \
            vibewarden:scan

      - name: Upload Trivy image SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  govulncheck:
    name: Go Vulnerability Check
    needs: [changes]
    # Run when path filter detects code change OR when Dependabot opened the PR.
    # Defense in depth — any future ecosystem added to dependabot.yml that
    # isn't in the path filter still gets the full check suite. See #1173.
    if: needs.changes.outputs.code == 'true' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
