name: Release dry-run

on:
  pull_request:
    paths:
      - ".goreleaser.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dryrun.yml"
      - "scripts/wrapper/vibew"
      - "scripts/wrapper/vibew.ps1"
      - "Dockerfile.goreleaser"

permissions:
  contents: read

jobs:
  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      # The snapshot builds the linux/arm64 image on an amd64 runner. Without
      # binfmt registration the arm64 alpine base cannot exec /bin/sh, so the
      # Dockerfile.goreleaser `RUN apk upgrade` layer dies with
      # "exec /bin/sh: exec format error". These two steps mirror release.yml
      # so the dry-run exercises the same build path as a real release.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --skip=publish --clean
