version: 2

updates:
  # Go module — main binary + all internal packages.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    labels:
      - tech-debt
    groups:
      # Bundle minor/patch bumps for the OpenTelemetry family — they move
      # in lockstep and reviewing them individually is churn.
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      # Bundle testcontainers modules — same lockstep pattern.
      testcontainers:
        patterns:
          - "github.com/testcontainers/*"

  # Go module — demo app (separate go.mod).
  - package-ecosystem: gomod
    directory: /examples/demo-app
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(demo)"
    labels:
      - tech-debt
      - demo-app

  # Python — Flask example app (requirements.txt).
  - package-ecosystem: pip
    directory: /examples/python-flask
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(flask-example)"
    labels:
      - tech-debt

  # npm — Next.js example app (package.json + package-lock.json).
  # Without this entry Dependabot only raised alerts and never opened PRs for
  # examples/nextjs, which is how it drifted to 13 open advisories (#1400).
  - package-ecosystem: npm
    directory: /examples/nextjs
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(nextjs-example)"
    labels:
      - tech-debt

  # npm — Express example app (package.json, no lockfile).
  # Its `express` dependency is in the repo dependency graph (so it can raise
  # alerts) but had no `updates:` entry, so Dependabot never opened a PR for
  # it — the same gap that let examples/nextjs drift 13 advisories behind
  # (#1400). Found while triaging the alert backlog in #1427.
  - package-ecosystem: npm
    directory: /examples/node-express
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(express-example)"
    labels:
      - tech-debt

  # Maven — Spring Boot example app (pom.xml).
  # Same gap as examples/node-express: `org.springframework.boot` appears in
  # the dependency graph but had no `updates:` entry (#1427).
  - package-ecosystem: maven
    directory: /examples/spring-boot
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(spring-example)"
    labels:
      - tech-debt

  # Docker — base images in Dockerfiles.
  #
  # `directory: /` only covered the root Dockerfile and Dockerfile.goreleaser,
  # which is how examples/demo-app sat on alpine:3.21 while root had already
  # moved to 3.24 (#1298). Directories are listed explicitly rather than
  # globbed: a `/**` glob would also rewrite generated bundles under
  # examples/demo-app/.vibewarden/ and the deliberately mismatched Dockerfile
  # fixtures under internal/cli/cmd/testdata/.
  #
  # This ecosystem finds Dockerfiles and Kubernetes/Helm manifests only — it
  # does not read compose files, so every compose file needs the separate
  # docker-compose entry below.
  - package-ecosystem: docker
    directories:
      - /
      - /examples/demo-app
      - /examples/nextjs
      - /examples/node-express
      - /examples/python-flask
      - /examples/spring-boot
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(docker)"
    labels:
      - tech-debt
    ignore:
      # examples/spring-boot pins two images that MUST share a Java major:
      # the maven build stage and the eclipse-temurin runtime stage. Dependabot
      # treats them as independent and proposed a Temurin 26 build stage against
      # a Temurin 25 runtime (#1499, #1505), which is an
      # UnsupportedClassVersionError at container start. The runtime image stays
      # watched and is the single trigger for moving the pair by hand; the maven
      # image is ignored outright because its `3.9-...` tag is floating, so
      # Maven's own patch releases arrive on rebuild without a PR.
      - dependency-name: "maven"

  # Docker Compose — image pins in compose files.
  #
  # Separate from the docker ecosystem above, which never fetches compose
  # files: without this entry the root docker-compose.yml and
  # test/egress/docker-compose.yml are unwatched, which is how test/egress sat
  # on alpine:3.21 (#1298). Listing /test/egress under `docker` instead would
  # only make that job error weekly — it holds no Dockerfile.
  #
  # Image tags inside internal/config/templates/*.tmpl stay invisible to
  # Dependabot — it cannot parse Go templates as Docker manifests. Those pins
  # are held to the root docker-compose.yml, which is covered here, by
  # internal/config/templates/image_pins_test.go.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /test/egress
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(compose)"
    labels:
      - tech-debt
    # Two majors are pinned deliberately (ADR-113). Without these rules
    # Dependabot reopens the same rejected PR every Monday. Minor and patch
    # updates keep flowing for both, so security patching is unaffected.
    ignore:
      # postgres 17 -> 18 changes the catalog version, so an existing
      # kratos-db volume refuses to start, and PG18's checksum-enabled initdb
      # makes pg_upgrade recovery worse. Revisit when VibeWarden owns a volume
      # migration path, or at PG17 EOL (November 2029).
      - dependency-name: "postgres"
        update-types:
          - version-update:semver-major
      # redis 7 -> 8 is a 2.4x image-size increase for zero reachable benefit;
      # the destination is Valkey (BSD-3), owned by #1497. Drop this rule when
      # #1497 lands.
      - dependency-name: "redis"
        update-types:
          - version-update:semver-major
      # openbao 2.5 -> 2.6 is a minor that changes the image user to non-root
      # (uid 100), which breaks seed-secrets writing back to the owner-only
      # bind-mounted .credentials file, and deprecates the `file` storage
      # backend the prod profile uses. Held on 2.5.x by #1291 and reaffirmed by
      # #1505; minor updates are ignored as well as majors because the break is
      # on the minor. Patch releases within 2.5.x keep flowing. Drop this rule
      # with the verified 2.6.x upgrade.
      - dependency-name: "quay.io/openbao/openbao"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  # GitHub Actions — keep CI actions pinned to latest.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - tech-debt
