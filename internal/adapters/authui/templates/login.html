<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <style>
    :root {
      --vw-primary: {{.PrimaryColor}};
      --vw-bg: {{.BackgroundColor}};
      --vw-text: {{.TextColor}};
      --vw-error: {{.ErrorColor}};
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--vw-bg);
      color: var(--vw-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--vw-text);
    }
    .field { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--vw-text);
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
      color: var(--vw-text);
      background: #f9fafb;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--vw-primary);
      background: #fff;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background: var(--vw-primary);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.25rem;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.65rem;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--vw-text);
      cursor: pointer;
      margin-bottom: 0.5rem;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-social:hover { background: #f3f4f6; }
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: #9ca3af;
      font-size: 0.8125rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      color: var(--vw-error);
      font-size: 0.875rem;
    }
    .links {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .links a {
      color: var(--vw-primary);
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover { text-decoration: underline; }
    .forgot { text-align: right; margin-top: 0.25rem; }
    .forgot a { font-size: 0.8125rem; color: var(--vw-primary); text-decoration: none; }
    .forgot a:hover { text-decoration: underline; }
    @media (max-width: 480px) { .card { padding: 2rem 1.25rem; } }
  </style>
</head>
<body>
<div class="card">
  <h1>Log in</h1>

  <div id="error-box" class="error-box" style="display:none"></div>

  <div id="social-buttons"></div>
  <div id="social-divider" class="divider" style="display:none">or</div>

  <form id="login-form">
    <input type="hidden" id="csrf-token" name="csrf_token" value="">
    <input type="hidden" id="flow-id" name="flow_id" value="">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="identifier" autocomplete="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      <div class="forgot"><a href="/_vibewarden/recovery">Forgot password?</a></div>
    </div>
    <button type="submit" class="btn-primary">Log in</button>
  </form>

  <div class="links">
    Don't have an account? <a href="/_vibewarden/registration{{.ReturnToQuery}}">Register</a>
  </div>
</div>

<script>
(function () {
  const kratosBase = '';
  const params = new URLSearchParams(window.location.search);

  // safeReturnTo validates that a return_to value is a same-origin relative
  // path. It mirrors the server-side isSafeReturnTo rules in handler.go:
  //   - must start with "/"
  //   - must not start with "//" (protocol-relative) or "/\" (backslash trick)
  //   - must not contain a scheme (URL() would expose via .protocol !== ":")
  //   - falls back to "/" on any invalid input
  function safeReturnTo(raw) {
    if (!raw || typeof raw !== 'string') return '/';
    if (!raw.startsWith('/')) return '/';
    if (raw.startsWith('//') || raw.startsWith('/\\')) return '/';
    try {
      // URL() requires an absolute base; use a dummy origin so we can inspect
      // the parsed result. If the path escapes to a different host or carries a
      // real scheme the check below will catch it.
      const parsed = new URL(raw, window.location.origin);
      if (parsed.origin !== window.location.origin) return '/';
    } catch (_) {
      return '/';
    }
    return raw;
  }

  const returnTo = safeReturnTo(params.get('return_to'));

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error-box').style.display = 'none';
  }

  // fetchFlow loads an existing flow by id. It returns null when Kratos no
  // longer serves that flow (410 Gone once the lifespan elapses, 404 after the
  // flow is garbage-collected) so callers can start a fresh one instead of
  // posting dead state.
  async function fetchFlow(flowId) {
    const res = await fetch(kratosBase + '/self-service/login/flows?id=' + encodeURIComponent(flowId), {
      headers: { Accept: 'application/json' },
      credentials: 'include',
    });
    if (!res.ok) return null;
    return await res.json();
  }

  // startFreshFlow initialises a brand-new browser login flow. Kratos
  // rotates the anti-CSRF cookie when it hands out a new flow, so the
  // csrf_token captured at page load is dead from this point on and every
  // caller must use the token carried by the returned flow.
  //
  // The init endpoint answers a plain browser navigation with a 303 to
  // ?flow=<id>, but that Location header is unreadable from fetch: with
  // redirect:'manual' the browser hands back an opaque-redirect response whose
  // status is 0 and whose header list is empty, so headers.get('location') is
  // always null. Content-negotiate JSON instead — Kratos then returns the flow
  // body itself — and fall back to the final URL of a followed redirect if
  // something in front of Kratos ignores the Accept header.
  async function startFreshFlow() {
    const initRes = await fetch(
      kratosBase + '/self-service/login/browser?return_to=' + encodeURIComponent(returnTo),
      { headers: { Accept: 'application/json' }, credentials: 'include' }
    );

    let flow = null;
    if (initRes.ok) {
      try {
        const body = await initRes.json();
        if (body && body.ui) flow = body;
      } catch (_) {
        flow = null;
      }
    }
    if (!flow) {
      const m = String(initRes.url || '').match(/[?&]flow=([^&]+)/);
      if (!m) throw new Error('no_flow_id');
      flow = await fetchFlow(decodeURIComponent(m[1]));
      if (!flow) throw new Error('fetch_flow_failed');
    }
    if (!flow.id) throw new Error('no_flow_id');

    history.replaceState(null, '', '?flow=' + encodeURIComponent(flow.id) + (returnTo !== '/' ? '&return_to=' + encodeURIComponent(returnTo) : ''));
    return flow;
  }

  // currentFlow returns a usable flow: the one referenced by the hidden field
  // (or the ?flow= query parameter on first load) when Kratos still accepts it,
  // otherwise a freshly initialised one. forceFresh skips the reuse attempt,
  // which is what a stale-flow retry needs.
  async function currentFlow(forceFresh) {
    const flowId = forceFresh ? '' : (document.getElementById('flow-id').value || params.get('flow') || '');
    if (flowId) {
      const flow = await fetchFlow(flowId);
      if (flow) return flow;
    }
    return await startFreshFlow();
  }

  async function initFlow() {
    let flow;
    try {
      flow = await currentFlow();
    } catch (_) {
      showError('Could not start login session. Please try again.');
      return;
    }
    applyFlow(flow);
  }

  // csrfOf reads the csrf_token out of a flow's UI nodes. Always read it from
  // the flow that is about to be posted to: a re-initialised flow comes with a
  // new anti-CSRF cookie, and the old token would be rejected.
  function csrfOf(flow) {
    const nodes = (flow && flow.ui && flow.ui.nodes) || [];
    const node = nodes.find(n => n.attributes && n.attributes.name === 'csrf_token');
    return node ? (node.attributes.value || '') : '';
  }

  // errorID returns Kratos's machine-readable error id for a plain error
  // envelope ({"error": {"id": "security_csrf_violation", ...}}). Flow bodies
  // carry a `ui` section instead and yield "".
  function errorID(body) {
    return (body && body.error && body.error.id) || '';
  }

  // bindFlow points the form at `flow` — hidden flow id plus the matching CSRF
  // token. Kept separate from applyFlow so a mid-submit refresh does not
  // re-render messages or social buttons.
  function bindFlow(flow) {
    document.getElementById('csrf-token').value = csrfOf(flow);
    document.getElementById('flow-id').value = flow.id || '';
  }

  function applyFlow(flow) {
    // Only real flow bodies may be applied. Kratos error envelopes (CSRF
    // violation, expired flow) have no `ui`; applying one would blank the
    // hidden flow id and strand the page on "please refresh".
    if (!flow || !flow.ui) return;

    bindFlow(flow);

    const nodes = flow.ui.nodes || [];

    // Show flow-level messages.
    const messages = flow.ui.messages || [];
    if (messages.length > 0) {
      showError(messages.map(m => m.text).join(' '));
    }

    // Show per-field messages.
    for (const node of nodes) {
      const msgs = (node.messages || []).filter(m => m.type === 'error');
      if (msgs.length > 0 && node.attributes && node.attributes.name) {
        const el = document.querySelector('[name="' + node.attributes.name + '"]');
        if (el) {
          el.style.borderColor = 'var(--vw-error)';
        }
        showError(msgs.map(m => m.text).join(' '));
      }
    }

    // Render OIDC social buttons. Replace rather than append: applyFlow runs
    // again on every validation error and on flow re-initialisation.
    const oidcNodes = nodes.filter(n => n.group === 'oidc' && n.attributes && n.attributes.type === 'submit');
    const socialDiv = document.getElementById('social-buttons');
    const divider = document.getElementById('social-divider');
    socialDiv.replaceChildren();
    for (const node of oidcNodes) {
      const label = (node.meta && node.meta.label && node.meta.label.text) || node.attributes.value;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-social';
      btn.textContent = 'Continue with ' + label;
      btn.addEventListener('click', function () {
        submitOIDC(node.attributes.value);
      });
      socialDiv.appendChild(btn);
    }
    divider.style.display = oidcNodes.length > 0 ? 'flex' : 'none';
  }

  async function submitOIDC(provider, retried) {
    try {
      const flow = await currentFlow(retried);
      bindFlow(flow);
      const res = await fetch(flow.ui.action, {
        method: flow.ui.method || 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          csrf_token: csrfOf(flow),
          method: 'oidc',
          provider: provider,
        }),
      });
      if (res.ok || res.redirected) {
        window.location.href = res.url || returnTo;
        return;
      }
      const body = await res.json().catch(() => null);
      if (!retried && isStaleFlow(res, body)) {
        await submitOIDC(provider, true);
        return;
      }
      applyFlow(body);
    } catch (_) {
      showError('Social login failed. Please try again.');
    }
  }

  // isStaleFlow reports whether a rejected submit means "the flow you posted is
  // no longer current" — Kratos answers 410 Gone for an expired flow and
  // security_csrf_violation when the anti-CSRF cookie was rotated under us.
  // Both are recoverable by starting a new flow and posting again.
  function isStaleFlow(res, body) {
    if (res.status === 410) return true;
    const id = errorID(body);
    return id === 'security_csrf_violation' || id === 'self_service_flow_expired';
  }

  // submitPassword posts credentials against a flow that was just re-read from
  // Kratos, so the csrf_token always matches the live anti-CSRF cookie. If the
  // flow dies between that read and the post, it re-initialises once and
  // retries. The page is never reloaded, so whatever the user typed survives.
  async function submitPassword(credentials, retried) {
    const flow = await currentFlow(retried);
    bindFlow(flow);

    const res = await fetch(flow.ui.action, {
      method: flow.ui.method || 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        csrf_token: csrfOf(flow),
        method: 'password',
        identifier: credentials.identifier,
        password: credentials.password,
      }),
    });

    if (res.ok || res.status === 303) {
      window.location.href = returnTo;
      return;
    }

    const body = await res.json().catch(() => null);

    if (!retried && isStaleFlow(res, body)) {
      await submitPassword(credentials, true);
      return;
    }

    if (body && body.ui) {
      applyFlow(body);
      return;
    }
    showError('Login failed. Please check your credentials and try again.');
  }

  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();

    const form = e.target;
    try {
      await submitPassword({
        identifier: form.identifier.value,
        password: form.password.value,
      }, false);
    } catch (err) {
      if (err && (err.message === 'no_flow_id' || err.message === 'fetch_flow_failed')) {
        showError('Could not start login session. Please try again.');
        return;
      }
      showError('Network error. Please check your connection and try again.');
    }
  });

  initFlow();
}());
</script>
</body>
</html>
