<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings</title>
  <style>
    :root {
      --vw-primary: {{.PrimaryColor}};
      --vw-bg: {{.BackgroundColor}};
      --vw-text: {{.TextColor}};
      --vw-error: {{.ErrorColor}};
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--vw-bg);
      color: var(--vw-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--vw-text);
    }
    .subtitle {
      font-size: 0.9375rem;
      color: #6b7280;
      margin-bottom: 1.75rem;
    }
    h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--vw-text);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .section { margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--vw-text);
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
      color: var(--vw-text);
      background: #f9fafb;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--vw-primary);
      background: #fff;
    }
    .btn-primary {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      background: var(--vw-primary);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.65rem;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--vw-text);
      cursor: pointer;
      margin-bottom: 0.5rem;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-social:hover { background: #f3f4f6; }
    .btn-unlink {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-unlink:hover { background: #fecaca; }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      color: var(--vw-error);
      font-size: 0.875rem;
    }
    .success-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      color: #15803d;
      font-size: 0.875rem;
    }
    .linked-provider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.625rem 0.875rem;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.9375rem;
    }
    .linked-provider span { color: #15803d; font-weight: 500; }
    .verification-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 0.875rem;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      margin-bottom: 1rem;
    }
    .verification-status.verified {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }
    .verification-status.unverified {
      background: #fefce8;
      border: 1px solid #fde68a;
      color: #92400e;
    }
    .links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .links a {
      color: var(--vw-primary);
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover { text-decoration: underline; }
    @media (max-width: 480px) { .card { padding: 2rem 1.25rem; } }
  </style>
</head>
<body>
<div class="card">
  <h1>Account settings</h1>
  <p class="subtitle">Manage your password, connected accounts, and email verification.</p>

  <div id="error-box" class="error-box" style="display:none"></div>
  <div id="success-box" class="success-box" style="display:none"></div>

  <!-- Email verification status -->
  <div class="section">
    <h2>Email verification</h2>
    <div id="verification-status" class="verification-status unverified">
      Checking verification status...
    </div>
    <button id="send-verification-btn" type="button" class="btn-primary" style="display:none">
      Send verification email
    </button>
  </div>

  <!-- Change password section -->
  <div class="section">
    <h2>Change password</h2>
    <form id="password-form">
      <input type="hidden" id="password-csrf-token" name="csrf_token" value="">
      <div class="field">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" name="password" autocomplete="new-password" required placeholder="••••••••">
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" name="password_confirm" autocomplete="new-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Update password</button>
    </form>
  </div>

  <!-- Social providers section -->
  <div class="section" id="social-section" style="display:none">
    <h2>Connected accounts</h2>
    <div id="linked-providers"></div>
    <div id="available-providers"></div>
  </div>

  <div class="links">
    <a href="/_vibewarden/login">Back to login</a>
  </div>
</div>

<script>
(function () {
  const kratosBase = '';
  const params = new URLSearchParams(window.location.search);

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
    document.getElementById('success-box').style.display = 'none';
  }

  function hideError() {
    document.getElementById('error-box').style.display = 'none';
  }

  function showSuccess(msg) {
    const box = document.getElementById('success-box');
    box.textContent = msg;
    box.style.display = 'block';
    document.getElementById('error-box').style.display = 'none';
  }

  // ---------------------------------------------------------------------------
  // Session / identity — determine email verification status
  // ---------------------------------------------------------------------------

  async function loadIdentity() {
    try {
      const res = await fetch(kratosBase + '/sessions/whoami', {
        headers: { Accept: 'application/json' },
        credentials: 'include',
      });
      if (!res.ok) {
        window.location.href = '/_vibewarden/login';
        return;
      }
      const session = await res.json();
      renderVerificationStatus(session);
    } catch (_) {
      // Non-fatal: verification status stays "checking".
    }
  }

  function renderVerificationStatus(session) {
    const identity = session.identity || {};
    const verifiableAddresses = identity.verifiable_addresses || [];
    const emailAddr = verifiableAddresses.find(a => a.via === 'email');
    const statusEl = document.getElementById('verification-status');
    const sendBtn = document.getElementById('send-verification-btn');

    if (!emailAddr) {
      statusEl.textContent = 'No email address found.';
      return;
    }

    if (emailAddr.verified) {
      statusEl.className = 'verification-status verified';
      statusEl.textContent = emailAddr.value + ' — verified';
    } else {
      statusEl.className = 'verification-status unverified';
      statusEl.textContent = emailAddr.value + ' — not verified';
      sendBtn.style.display = 'inline-block';
    }
  }

  // ---------------------------------------------------------------------------
  // Settings flow — change password + social providers
  // ---------------------------------------------------------------------------

  let activeFlow = null;

  // fetchFlow loads a settings flow by id. It returns null when Kratos no
  // longer serves that flow (410 Gone once the lifespan elapses, 404 after the
  // flow is garbage-collected) so callers can start a fresh one instead of
  // posting dead state.
  async function fetchFlow(flowId) {
    const res = await fetch(
      kratosBase + '/self-service/settings/flows?id=' + encodeURIComponent(flowId),
      { headers: { Accept: 'application/json' }, credentials: 'include' }
    );
    if (!res.ok) return null;
    return await res.json();
  }

  // startFreshFlow initialises a brand-new browser settings flow. Kratos
  // rotates the anti-CSRF cookie when it hands out a new flow, so the
  // csrf_token captured at page load is dead from this point on and every
  // caller must use the token carried by the returned flow.
  async function startFreshFlow() {
    const initRes = await fetch(kratosBase + '/self-service/settings/browser', {
      redirect: 'manual',
      credentials: 'include',
    });
    // Kratos redirects to ?flow=<id>.
    const location = initRes.headers.get('location') || '';
    const m = location.match(/[?&]flow=([^&]+)/);
    if (!m) throw new Error('no_flow_id');
    const flowId = m[1];
    history.replaceState(null, '', '?flow=' + flowId);

    const flow = await fetchFlow(flowId);
    if (!flow) throw new Error('fetch_flow_failed');
    return flow;
  }

  // currentFlow returns a usable flow: the active one when Kratos still accepts
  // it, otherwise a freshly initialised one. forceFresh skips the reuse
  // attempt, which is what a stale-flow retry needs.
  async function currentFlow(forceFresh) {
    const flowId = forceFresh ? '' : ((activeFlow && activeFlow.id) || params.get('flow') || '');
    if (flowId) {
      const flow = await fetchFlow(flowId);
      if (flow) return flow;
    }
    return await startFreshFlow();
  }

  async function initSettingsFlow() {
    try {
      activeFlow = await currentFlow();
    } catch (_) {
      showError('Could not load settings. Please refresh the page.');
      return;
    }
    applyFlow(activeFlow);
  }

  // csrfOf reads the csrf_token out of a flow's UI nodes. Always read it from
  // the flow that is about to be posted to: a re-initialised flow comes with a
  // new anti-CSRF cookie, and the old token would be rejected.
  function csrfOf(flow) {
    const nodes = (flow && flow.ui && flow.ui.nodes) || [];
    const node = nodes.find(n => n.attributes && n.attributes.name === 'csrf_token');
    return node ? (node.attributes.value || '') : '';
  }

  // errorID returns Kratos's machine-readable error id for a plain error
  // envelope ({"error": {"id": "security_csrf_violation", ...}}). Flow bodies
  // carry a `ui` section instead and yield "".
  function errorID(body) {
    return (body && body.error && body.error.id) || '';
  }

  // isStaleFlow reports whether a rejected submit means "the flow you posted is
  // no longer current" — Kratos answers 410 Gone for an expired flow and
  // security_csrf_violation when the anti-CSRF cookie was rotated under us.
  function isStaleFlow(res, body) {
    if (res.status === 410) return true;
    const id = errorID(body);
    return id === 'security_csrf_violation' || id === 'self_service_flow_expired';
  }

  // bindFlow points the password form at `flow` — action, method and the
  // matching CSRF token. Kept separate from applyFlow so a mid-submit refresh
  // does not re-render messages or provider buttons.
  function bindFlow(flow) {
    activeFlow = flow;
    document.getElementById('password-csrf-token').value = csrfOf(flow);
    const form = document.getElementById('password-form');
    form.dataset.action = (flow.ui && flow.ui.action) || '';
    form.dataset.method = (flow.ui && flow.ui.method) || 'POST';
  }

  function applyFlow(flow) {
    // Only real flow bodies may be applied. Kratos error envelopes (CSRF
    // violation, expired flow) have no `ui`; applying one would blank the
    // form action and strand the page on "please refresh".
    if (!flow || !flow.ui) return;

    bindFlow(flow);

    const nodes = flow.ui.nodes || [];

    // Flow-level messages.
    const messages = flow.ui.messages || [];
    if (messages.length > 0) {
      const errorMsgs = messages.filter(m => m.type === 'error');
      const successMsgs = messages.filter(m => m.type !== 'error');
      if (errorMsgs.length > 0) showError(errorMsgs.map(m => m.text).join(' '));
      if (successMsgs.length > 0) showSuccess(successMsgs.map(m => m.text).join(' '));
    }

    // Render OIDC (social) provider nodes.
    renderSocialProviders(nodes, csrfOf(flow));
  }

  function renderSocialProviders(nodes, csrfVal) {
    const oidcNodes = nodes.filter(n => n.group === 'oidc' && n.attributes);

    const linkedDiv = document.getElementById('linked-providers');
    const availableDiv = document.getElementById('available-providers');
    // Replace rather than append: applyFlow runs again on every validation
    // error and on flow re-initialisation.
    linkedDiv.replaceChildren();
    availableDiv.replaceChildren();

    if (oidcNodes.length === 0) return;
    document.getElementById('social-section').style.display = 'block';

    // Unlink buttons (type=submit with value indicating a provider to unlink).
    const unlinkNodes = oidcNodes.filter(n => n.attributes.type === 'submit' && n.attributes.name === 'unlink');
    for (const node of unlinkNodes) {
      const label = (node.meta && node.meta.label && node.meta.label.text) || node.attributes.value;
      const row = document.createElement('div');
      row.className = 'linked-provider';
      const span = document.createElement('span');
      span.textContent = label;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-unlink';
      btn.textContent = 'Unlink';
      btn.addEventListener('click', function () {
        submitOIDC('unlink', node.attributes.value);
      });
      row.appendChild(span);
      row.appendChild(btn);
      linkedDiv.appendChild(row);
    }

    // Link buttons (type=submit with value indicating a provider to link).
    const linkNodes = oidcNodes.filter(n => n.attributes.type === 'submit' && n.attributes.name === 'link');
    for (const node of linkNodes) {
      const label = (node.meta && node.meta.label && node.meta.label.text) || node.attributes.value;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-social';
      btn.textContent = 'Link ' + label;
      btn.addEventListener('click', function () {
        submitOIDC('link', node.attributes.value);
      });
      availableDiv.appendChild(btn);
    }
  }

  async function submitOIDC(method, provider, retried) {
    hideError();
    try {
      const flow = await currentFlow(retried);
      bindFlow(flow);
      const res = await fetch(flow.ui.action, {
        method: flow.ui.method || 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ csrf_token: csrfOf(flow), method: method, provider: provider }),
      });
      if (res.ok || res.redirected) {
        window.location.reload();
        return;
      }
      const body = await res.json().catch(() => null);
      if (!retried && isStaleFlow(res, body)) {
        await submitOIDC(method, provider, true);
        return;
      }
      applyFlow(body);
    } catch (_) {
      showError('Social provider action failed. Please try again.');
    }
  }

  // ---------------------------------------------------------------------------
  // Email verification — send verification link
  // ---------------------------------------------------------------------------

  document.getElementById('send-verification-btn').addEventListener('click', async function () {
    hideError();
    try {
      const initRes = await fetch(kratosBase + '/self-service/verification/browser', {
        redirect: 'manual',
        credentials: 'include',
      });
      const location = initRes.headers.get('location') || '';
      const m = location.match(/[?&]flow=([^&]+)/);
      if (!m) throw new Error('no_flow');
      const flowId = m[1];

      const res = await fetch(
        kratosBase + '/self-service/verification/flows?id=' + encodeURIComponent(flowId),
        { headers: { Accept: 'application/json' }, credentials: 'include' }
      );
      const flow = await res.json();
      const nodes = (flow.ui && flow.ui.nodes) || [];
      const csrfNode = nodes.find(n => n.attributes && n.attributes.name === 'csrf_token');

      // Submit email from session.
      const sessionRes = await fetch(kratosBase + '/sessions/whoami', {
        headers: { Accept: 'application/json' },
        credentials: 'include',
      });
      const session = await sessionRes.json();
      const identity = session.identity || {};
      const verifiableAddresses = identity.verifiable_addresses || [];
      const emailAddr = verifiableAddresses.find(a => a.via === 'email');
      if (!emailAddr) { showError('No email address found for verification.'); return; }

      await fetch(flow.ui.action, {
        method: flow.ui.method || 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          csrf_token: csrfNode ? (csrfNode.attributes.value || '') : '',
          method: 'link',
          email: emailAddr.value,
        }),
      });
      showSuccess('Verification email sent. Please check your inbox.');
      document.getElementById('send-verification-btn').style.display = 'none';
    } catch (_) {
      showError('Could not send verification email. Please try again.');
    }
  });

  // ---------------------------------------------------------------------------
  // Change password form submit
  // ---------------------------------------------------------------------------

  // submitPassword posts against a flow that was just re-read from Kratos, so
  // the csrf_token always matches the live anti-CSRF cookie. If the flow dies
  // between that read and the post, it re-initialises once and retries. The
  // page is never reloaded, so whatever the user typed survives.
  async function submitPassword(password, retried) {
    const flow = await currentFlow(retried);
    bindFlow(flow);

    const res = await fetch(flow.ui.action, {
      method: flow.ui.method || 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        csrf_token: csrfOf(flow),
        method: 'password',
        password: password,
      }),
    });

    if (res.ok) {
      showSuccess('Password updated successfully.');
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-password').value = '';
      // Kratos returns the post-submit flow; re-bind so the next change uses a
      // live CSRF token instead of the one that was just spent.
      const body = await res.json().catch(() => null);
      if (body && body.ui) bindFlow(body);
      return;
    }

    const body = await res.json().catch(() => null);

    if (!retried && isStaleFlow(res, body)) {
      await submitPassword(password, true);
      return;
    }

    if (body && body.ui) {
      applyFlow(body);
      return;
    }
    showError('Password update failed. Please try again.');
  }

  document.getElementById('password-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();

    const pw = document.getElementById('new-password').value;
    const pwc = document.getElementById('confirm-password').value;
    if (pw !== pwc) { showError('Passwords do not match.'); return; }

    try {
      await submitPassword(pw, false);
    } catch (err) {
      if (err && (err.message === 'no_flow_id' || err.message === 'fetch_flow_failed')) {
        showError('Could not load settings. Please refresh the page.');
        return;
      }
      showError('Network error. Please check your connection and try again.');
    }
  });

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------

  loadIdentity();
  initSettingsFlow();
}());
</script>
</body>
</html>
